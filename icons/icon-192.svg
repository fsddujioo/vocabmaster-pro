<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <g filter="url(#shadow)" transform="translate(60, 60)">
    <!-- Back card -->
    <rect x="60" y="30" width="260" height="340" rx="24" fill="#ffffff" fill-opacity="0.25" transform="rotate(12 190 200)" />
    <!-- Front card -->
    <rect x="60" y="30" width="260" height="340" rx="24" fill="#ffffff" />
    <!-- Card content -->
    <rect x="90" y="70" width="80" height="28" rx="8" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="130" y="90" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">CEFR C1</text>
    <text x="190" y="160" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#0f172a" text-anchor="middle">Eloquent</text>
    <text x="190" y="200" font-family="system-ui, sans-serif" font-size="18" fill="#64748b" text-anchor="middle">/ˈel.ə.kwənt/</text>
    <line x1="100" y1="230" x2="280" y2="230" stroke="#e2e8f0" stroke-width="2"/>
    <text x="190" y="270" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">Hùng biện &amp; Lưu loát</text>
    <!-- Audio icon -->
    <circle cx="190" cy="320" r="22" fill="#3b82f6"/>
    <path d="M182 313 v14 l6 -4 l7 0 l0 -6 l-7 0 z" fill="#ffffff"/>
  </g>
</svg>